<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangChain4j na prática</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #16181d; --muted: #5d6270; --line: #e2ded6;
    --accent: #0f7b5f; --accent-soft: #e3f3ed; --warn: #b4540a; --warn-soft: #fdf0e4;
    --danger: #b3261e; --danger-soft: #fbe7e5; --code-bg: #15181f; --code-ink: #e8e6e1;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); }
  .app { display: grid; grid-template-columns: 270px 1fr 420px; height: 100vh; }

  /* Passos */
  nav { border-right: 1px solid var(--line); padding: 24px 16px; overflow-y: auto; }
  nav h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 8px 18px; }
  .step { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px; border-radius: 10px;
          font: inherit; color: inherit; cursor: pointer; margin-bottom: 4px; }
  .step:hover { background: #ebe7df; }
  .step.active { background: var(--ink); color: #fff; }
  .step b { display: block; font-size: 16px; }
  .step span { font-size: 13.5px; opacity: .72; }
  .step .n { font-family: var(--mono); font-size: 12px; opacity: .6; }

  /* Conversa */
  main { display: flex; flex-direction: column; min-width: 0; }
  header.passo { padding: 22px 32px 14px; border-bottom: 1px solid var(--line); }
  header.passo h2 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
  header.passo p { margin: 4px 0 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 32px 0; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px;
          font: inherit; font-size: 14.5px; cursor: pointer; max-width: 100%; text-align: left; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .thread { flex: 1; overflow-y: auto; padding: 20px 32px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 14px; white-space: normal; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai ul { margin: 4px 0 8px; padding-left: 20px; }
  .msg.blocked { align-self: flex-start; background: var(--danger-soft); border: 1px solid #f0c3be; color: var(--danger); }
  .msg.erro { align-self: flex-start; background: var(--warn-soft); color: var(--warn); }
  .msg.loading { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 10px; padding: 16px 32px 24px; border-top: 1px solid var(--line); }
  form input { flex: 1; font: inherit; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
  form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { font: inherit; font-weight: 600; padding: 0 22px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .nova { font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; margin-left: 32px; margin-top: 8px; align-self: flex-start; }

  /* Cartão de risco (passo 3) */
  .risco { display: grid; gap: 10px; min-width: 340px; }
  .risco .topo { display: flex; align-items: center; gap: 12px; }
  .badge { font-weight: 700; font-size: 13px; letter-spacing: .06em; padding: 4px 10px; border-radius: 6px; }
  .badge.BAIXO { background: var(--accent-soft); color: var(--accent); }
  .badge.MEDIO { background: #fff6d6; color: #8a6400; }
  .badge.ALTO, .badge.CRITICO { background: var(--danger-soft); color: var(--danger); }
  .score { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .risco dt { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .risco dd { margin: 0 0 4px; }

  /* Bastidores */
  aside { border-left: 1px solid var(--line); background: #faf9f6; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; font: inherit; font-size: 14.5px; font-weight: 600; padding: 16px 0; background: none; border: 0;
                 border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--ink); }
  .painel { flex: 1; overflow-y: auto; padding: 20px; }
  .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .metrica { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .metrica small { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .metrica strong { font-size: 20px; font-variant-numeric: tabular-nums; }
  .painel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .item .nome { font-family: var(--mono); font-weight: 600; color: var(--accent); }
  .item pre, .codigo { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; color: var(--muted); max-height: 160px; overflow: auto; }
  .codigo { background: var(--code-bg); color: var(--code-ink); padding: 16px; border-radius: 10px; max-height: none; font-size: 13px; line-height: 1.55; }
  .vazio { color: var(--muted); font-size: 14px; }

  @media (max-width: 1100px) { .app { grid-template-columns: 220px 1fr; } aside { display: none; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>LangChain4j na prática</h1>
    <div id="passos"></div>
  </nav>

  <main>
    <header class="passo"><h2 id="titulo"></h2><p id="descricao"></p></header>
    <div class="chips" id="chips"></div>
    <button class="nova" id="nova" type="button">nova conversa (limpa a memória)</button>
    <div class="thread" id="thread"></div>
    <form id="form">
      <input id="entrada" autocomplete="off" placeholder="Escreva uma mensagem…">
      <button type="submit">Enviar</button>
    </form>
  </main>

  <aside>
    <div class="tabs">
      <button class="active" data-tab="bastidores" type="button">Bastidores</button>
      <button data-tab="codigo" type="button">Código</button>
    </div>
    <div class="painel" id="painel"></div>
  </aside>
</div>

<script>
const PASSOS = [
  {
    id: "1-chat", titulo: "Chat básico", sub: "ChatModel, sem memória",
    descricao: "API de baixo nível: montamos as mensagens e chamamos o modelo. Cada chamada é independente.",
    chips: [
      "Explique em poucas palavras o que é tomada de conta (account takeover).",
      "Qual foi a pergunta que eu fiz antes desta?"
    ],
    codigo: `ChatResponse resposta = chatModel.chat(
    ChatRequest.builder()
        .messages(
            SystemMessage.from("Responda em PT-BR, em até 3 frases."),
            UserMessage.from(pergunta))
        .build());

resposta.aiMessage().text();
resposta.tokenUsage();   // custo da chamada`
  },
  {
    id: "2-assistente", titulo: "AI Service + memória", sub: "interface declarativa", memoria: true,
    descricao: "Só uma interface Java. O LangChain4j implementa, monta o prompt e guarda o histórico por conversa.",
    chips: [
      "Oi! Meu nome é Carla e meu cartão final 4321 foi recusado numa compra.",
      "Qual é o meu nome e o final do meu cartão?",
      "Pode me passar minha senha?"
    ],
    codigo: `@AiService(wiringMode = EXPLICIT,
           chatModel = "openAiChatModel",
           chatMemoryProvider = "chatMemoryProvider")
public interface AssistenteAtendimento {

    @SystemMessage("""
        Você é a assistente virtual de uma fintech...
        Nunca peça senha, código ou cartão completo.
        """)
    Result<String> conversar(@MemoryId String conversaId,
                             @UserMessage String mensagem);
}

// Memória: janela das últimas 20 mensagens por conversa
memoryId -> MessageWindowChatMemory.builder()
        .id(memoryId).maxMessages(20)
        .chatMemoryStore(store)   // Redis, banco...
        .build();`
  },
  {
    id: "3-estruturado", titulo: "Saída estruturada", sub: "texto livre → record Java",
    descricao: "O retorno do método é um record. O modelo devolve JSON no formato do record e recebemos um objeto tipado.",
    chips: [
      "Recebi uma ligação de alguém dizendo ser da central de segurança. Disseram que minha conta foi invadida e que eu precisava transferir o saldo para uma conta segura. Pediram o código que chegou por SMS e eu passei. Depois fiz 2 Pix de R$ 800.",
      "Fiz uma compra de R$ 45 no mercado perto de casa e a cobrança apareceu duplicada no extrato."
    ],
    codigo: `public record AnaliseRisco(
    @Description("Nível de risco") NivelRisco nivel,
    @Description("Score de 0 a 100") int score,
    String tipoProvavelDeGolpe,
    List<String> sinaisDeAlerta,
    String acaoRecomendada,
    boolean exigeRevisaoHumana) {}

@AiService(wiringMode = EXPLICIT, chatModel = "openAiChatModel")
public interface AnalisadorOcorrencia {

    @SystemMessage("Você é um analista sênior de prevenção à fraude...")
    @UserMessage("Relato: {{relato}}")
    Result<AnaliseRisco> analisar(@V("relato") String relato);
}`
  },
  {
    id: "4-rag", titulo: "RAG", sub: "respostas com as nossas políticas",
    descricao: "Antes do modelo, buscamos os trechos mais relevantes das políticas internas e injetamos no prompt.",
    chips: [
      "Qual é o limite de Pix à noite e quando passa a valer um aumento de limite?",
      "Quais são os critérios para solicitar bloqueio cautelar?",
      "Qual é a política de cashback para cartão de crédito?"
    ],
    codigo: `// Ingestão (na subida): documento → chunks → vetores → store
EmbeddingStoreIngestor.builder()
    .documentSplitter(DocumentSplitters.recursive(500, 80))
    .embeddingModel(embeddingModel)
    .embeddingStore(embeddingStore)
    .build()
    .ingest(documentos);

// Recuperação (a cada pergunta)
EmbeddingStoreContentRetriever.builder()
    .embeddingStore(embeddingStore)
    .embeddingModel(embeddingModel)
    .maxResults(3).minScore(0.55)
    .build();

@AiService(..., contentRetriever = "politicasRetriever")
public interface ConsultorPoliticas { ... }`
  },
  {
    id: "5-agente", titulo: "Tools / Agente", sub: "o modelo chama métodos Java", memoria: true,
    descricao: "O modelo decide quais métodos chamar para buscar fatos, aplica a política via RAG e propõe uma ação.",
    chips: [
      "Analise o cliente 1001. Há indício de fraude? Se a política indicar, solicite o bloqueio cautelar.",
      "Agora analise o cliente 1002.",
      "Resuma em uma frase o caso do primeiro cliente."
    ],
    codigo: `@Component
public class FerramentasAntifraude {

    @Tool("Lista as transações recentes do cliente...")
    public List<Transacao> consultarTransacoesRecentes(
            @P("Identificador do cliente") String clienteId) { ... }

    @Tool("Abre SOLICITAÇÃO de bloqueio cautelar, pendente de aprovação humana")
    public SolicitacaoBloqueio solicitarBloqueioCautelar(
            String clienteId, String motivo) { ... }
}

@AiService(wiringMode = EXPLICIT,
           chatModel = "openAiChatModel",
           chatMemoryProvider = "chatMemoryProvider",
           contentRetriever = "politicasRetriever",
           tools = {"ferramentasAntifraude"})
public interface AgenteAntifraude { ... }`
  },
  {
    id: "5-agente", titulo: "Guardrail", sub: "proteção antes do modelo", memoria: true, chave: "6",
    descricao: "Código Java que roda antes do LLM. Número de cartão completo é barrado e nunca sai da aplicação.",
    chips: [
      "O cliente 1001 informou o cartão 4111 1111 1111 1111. Verifique se ele foi clonado.",
      "O cliente 1001 informou o cartão final 1111. Verifique os acessos recentes dele."
    ],
    codigo: `public class BloqueioDadosCartaoGuardrail implements InputGuardrail {

    @Override
    public InputGuardrailResult validate(UserMessage msg) {
        if (contemNumeroDeCartao(msg.singleText())) {   // regex + Luhn
            return failure("Mensagem bloqueada: número de cartão completo.");
        }
        return success();
    }
}

@InputGuardrails(BloqueioDadosCartaoGuardrail.class)
public interface AgenteAntifraude { ... }`
  }
];

const $ = (id) => document.getElementById(id);
const estado = { passo: 0, aba: "bastidores", ultima: null, conversas: {}, threads: {} };

function chave(i) { return PASSOS[i].chave || PASSOS[i].id + "#" + i; }
function novaConversa(i) { estado.conversas[chave(i)] = "c-" + Math.random().toString(36).slice(2, 10); estado.threads[chave(i)] = []; }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// Markdown mínimo: negrito, itálico, listas, títulos e parágrafos
function md(texto) {
  const linhas = esc(texto).split("\n");
  let html = "", lista = false;
  for (let l of linhas) {
    l = l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
    const item = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (item) { if (!lista) { html += "<ul>"; lista = true; } html += "<li>" + item[1] + "</li>"; continue; }
    if (lista) { html += "</ul>"; lista = false; }
    const titulo = l.match(/^#{1,4}\s+(.*)/);
    if (titulo) { html += "<p><strong>" + titulo[1] + "</strong></p>"; continue; }
    if (l.trim()) html += "<p>" + l + "</p>";
  }
  return html + (lista ? "</ul>" : "");
}

function cartaoRisco(r) {
  return `<div class="risco">
    <div class="topo"><span class="score">${esc(r.score)}</span><span class="badge ${esc(r.nivel)}">${esc(r.nivel)}</span>
      <span>${r.exigeRevisaoHumana ? "Exige revisão humana" : "Sem revisão humana"}</span></div>
    <dl>
      <dt>Tipo provável</dt><dd>${esc(r.tipoProvavelDeGolpe)}</dd>
      <dt>Sinais de alerta</dt><dd>${(r.sinaisDeAlerta || []).map(s => "• " + esc(s)).join("<br>") || "—"}</dd>
      <dt>Ação recomendada</dt><dd>${esc(r.acaoRecomendada)}</dd>
    </dl></div>`;
}

function renderPassos() {
  $("passos").innerHTML = PASSOS.map((p, i) =>
    `<button class="step ${i === estado.passo ? "active" : ""}" data-i="${i}" type="button">
       <span class="n">PASSO ${i + 1}</span><b>${p.titulo}</b><span>${p.sub}</span></button>`).join("");
  document.querySelectorAll(".step").forEach(b => b.onclick = () => selecionar(+b.dataset.i));
}

function renderThread() {
  const msgs = estado.threads[chave(estado.passo)] || [];
  $("thread").innerHTML = msgs.map(m => {
    if (m.tipo === "user") return `<div class="msg user">${esc(m.texto)}</div>`;
    if (m.tipo === "loading") return `<div class="msg ai loading">pensando…</div>`;
    if (m.tipo === "blocked") return `<div class="msg blocked"><strong>Guardrail:</strong> ${esc(m.texto)}</div>`;
    if (m.tipo === "erro") return `<div class="msg erro">${esc(m.texto)}</div>`;
    if (typeof m.conteudo === "object" && m.conteudo !== null) return `<div class="msg ai">${cartaoRisco(m.conteudo)}</div>`;
    return `<div class="msg ai">${md(m.conteudo)}</div>`;
  }).join("");
  $("thread").scrollTop = $("thread").scrollHeight;
}

function renderPainel() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === estado.aba));
  const p = PASSOS[estado.passo];
  if (estado.aba === "codigo") { $("painel").innerHTML = `<pre class="codigo">${esc(p.codigo)}</pre>`; return; }
  const r = estado.ultima;
  if (!r) { $("painel").innerHTML = `<p class="vazio">Envie uma mensagem para ver tokens, latência, tools chamadas e trechos recuperados.</p>`; return; }
  const n = (v) => v == null ? "—" : v.toLocaleString("pt-BR");
  let html = `<div class="metricas">
      <div class="metrica"><small>Latência</small><strong>${n(r.latenciaMs)}<small style="display:inline"> ms</small></strong></div>
      <div class="metrica"><small>Tokens in</small><strong>${n(r.tokensEntrada)}</strong></div>
      <div class="metrica"><small>Tokens out</small><strong>${n(r.tokensSaida)}</strong></div></div>`;
  if (r.bloqueio) html += `<h3>Guardrail</h3><div class="item">Bloqueado antes de chegar ao modelo — 0 tokens gastos, nenhum dado enviado.</div>`;
  html += `<h3>Tools chamadas (${(r.tools || []).length})</h3>`;
  html += (r.tools || []).length ? r.tools.map((t, i) => `<div class="item"><span class="nome">${i + 1}. ${esc(t.nome)}</span>
      <pre>args: ${esc(t.argumentos)}</pre><pre>→ ${esc(t.resultado)}</pre></div>`).join("") : `<p class="vazio">Nenhuma.</p>`;
  html += `<h3>Trechos recuperados pelo RAG (${(r.fontes || []).length})</h3>`;
  html += (r.fontes || []).length ? r.fontes.map(f => `<div class="item"><span class="nome">${esc(f.arquivo)}</span><pre>${esc(f.trecho)}</pre></div>`).join("") : `<p class="vazio">Nenhum.</p>`;
  if (typeof r.resposta === "object" && r.resposta !== null) html += `<h3>Objeto Java recebido</h3><div class="item"><pre>${esc(JSON.stringify(r.resposta, null, 2))}</pre></div>`;
  $("painel").innerHTML = html;
}

function selecionar(i) {
  estado.passo = i; estado.ultima = null;
  const p = PASSOS[i];
  if (!estado.conversas[chave(i)]) novaConversa(i);
  $("titulo").textContent = `${i + 1}. ${p.titulo}`;
  $("descricao").textContent = p.descricao;
  $("nova").style.display = p.memoria ? "" : "none";
  $("chips").innerHTML = p.chips.map((c, k) => `<button class="chip" data-k="${k}" type="button">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => enviar(p.chips[+b.dataset.k]));
  renderPassos(); renderThread(); renderPainel();
  $("entrada").focus();
}

async function enviar(texto) {
  texto = texto.trim(); if (!texto) return;
  const i = estado.passo, p = PASSOS[i], k = chave(i), thread = estado.threads[k];
  thread.push({ tipo: "user", texto }, { tipo: "loading" });
  renderThread(); $("entrada").value = "";
  try {
    const res = await fetch("/api/demo/" + p.id, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversaId: estado.conversas[k], mensagem: texto })
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " — veja o log da aplicação");
    const r = await res.json();
    thread.pop();
    thread.push(r.bloqueio ? { tipo: "blocked", texto: r.bloqueio } : { tipo: "ai", conteudo: r.resposta });
    if (estado.passo === i) { estado.ultima = r; }
  } catch (e) {
    thread.pop(); thread.push({ tipo: "erro", texto: "Erro: " + e.message });
  }
  if (estado.passo === i) { renderThread(); renderPainel(); }
}

$("form").onsubmit = (e) => { e.preventDefault(); enviar($("entrada").value); };
$("nova").onclick = () => { novaConversa(estado.passo); estado.ultima = null; renderThread(); renderPainel(); };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { estado.aba = b.dataset.tab; renderPainel(); });
selecionar(0);
</script>
</body>
</html>
